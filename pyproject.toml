[build-system]
requires = ["scikit-build-core>=0.8.0", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "apg_sgm"
version = "1.0.0"
description = "APG-SGM Stereo Engine Python bindings"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
]
authors = [
    { name = "APG-SGM Authors" }
]

[tool.scikit-build]
cmake.args = [
    "-DAPG_SGM_BUILD_PYTHON=ON",
    "-DAPG_SGM_BUILD_APPS=OFF",
    "-DAPG_SGM_BUILD_TESTS=OFF",
    "-DAPG_SGM_BUILD_BENCHMARKS=OFF",
]
wheel.packages = ["python/apg_sgm"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
