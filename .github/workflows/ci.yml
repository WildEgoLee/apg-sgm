name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
            cc: gcc
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
            cc: clang
          - os: ubuntu-latest
            compiler: clang-asan-ubsan
            cxx: clang++
            cc: clang
            sanitize: asan-ubsan
          - os: ubuntu-latest
            compiler: gcc-shared
            cxx: g++
            cc: gcc
            shared: on
          - os: windows-latest
            compiler: msvc
            cxx: cl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev python3-pip python3-setuptools

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.sanitize }}" == "asan-ubsan" ]; then
            EXTRA_FLAGS="-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_C_FLAGS=-fsanitize=address,undefined"
          fi
          if [ "${{ matrix.shared }}" == "on" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DBUILD_SHARED_LIBS=ON"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            $EXTRA_FLAGS

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify find_package consumer project
        if: runner.os == 'Linux' && matrix.sanitize != 'asan-ubsan'
        run: |
          cmake --install build --prefix install_test
          cmake -S tests/test_cmake_package -B build_pkg_test \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH=$PWD/install_test
          cmake --build build_pkg_test

      - name: Run Benchmark Smoke Test
        if: matrix.sanitize != 'asan-ubsan'
        shell: bash
        run: |
          python3 tools/prepare_dataset.py --synthetic || python tools/prepare_dataset.py --synthetic
          if [ "$RUNNER_OS" == "Windows" ]; then
            BENCH_EXE="./build/Release/apg-benchmark.exe"
          else
            BENCH_EXE="./build/apg-benchmark"
          fi
          $BENCH_EXE --manifest benchmarks/manifests/synthetic.txt --output results/test_ci.csv --warmup 0 --repeat 1
          $BENCH_EXE --manifest benchmarks/manifests/synthetic.txt --backend packed --output results/test_packed_ci.csv --warmup 0 --repeat 1
          $BENCH_EXE --manifest benchmarks/manifests/synthetic.txt --modes E --verify-backends

      - name: Build and test Python bindings
        if: matrix.sanitize != 'asan-ubsan'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            python -m pip install --upgrade pip scikit-build-core pybind11 pytest numpy
            python -m pip install --no-build-isolation -e .
            python -m pytest
          else
            export CC=${{ matrix.cc }}
            export CXX=${{ matrix.cxx }}
            python3 -m pip install --break-system-packages scikit-build-core pybind11 pytest numpy || python3 -m pip install scikit-build-core pybind11 pytest numpy
            python3 -m pip install --no-build-isolation -e .
            python3 -m pytest
          fi
