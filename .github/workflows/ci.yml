name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cxx: cl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libomp-dev

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Run Benchmark Smoke Test
        shell: bash
        run: |
          python3 tools/prepare_dataset.py --synthetic || python tools/prepare_dataset.py --synthetic
          if [ "$RUNNER_OS" == "Windows" ]; then
            BENCH_EXE="./build/Release/apg-benchmark.exe"
          else
            BENCH_EXE="./build/apg-benchmark"
          fi
          $BENCH_EXE --manifest benchmarks/manifests/synthetic.txt --output results/test_ci.csv --warmup 0 --repeat 1
          $BENCH_EXE --manifest benchmarks/manifests/synthetic.txt --backend packed --output results/test_packed_ci.csv --warmup 0 --repeat 1
          $BENCH_EXE --manifest benchmarks/manifests/synthetic.txt --modes E --verify-backends
